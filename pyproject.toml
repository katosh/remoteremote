[project]
name = "tvremote"
version = "1.0.0"
description = "Web-based TV remote control for Samsung and Philips Smart TVs"
requires-python = ">=3.10"
dependencies = [
    # Flask and extensions
    "flask>=2.3.0",
    "flask-login>=0.6.0",
    "flask-wtf>=1.2.0",
    "flask-sqlalchemy>=3.1.0",
    "flask-limiter>=3.5.0",
    "flask-babel>=4.0.0",
    # Database
    "sqlalchemy>=2.0.0",
    # Scheduler
    "apscheduler>=3.10.0",
    # Security
    "bcrypt>=4.1.0",
    "python-dotenv>=1.0.0",
    # HTTP client (for TV API)
    "requests>=2.31.0",
    # Philips TV support
    "philipstv>=2.1.0",
    # Timezone support
    "pytz>=2024.1",
    # Production server
    "gunicorn>=21.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-flask>=1.3.0",
    "pytest-cov>=4.1.0",
    "watchdog>=3.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

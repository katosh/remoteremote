{% extends "base.html" %}

{% block title %}Anmelden - TV Fernbedienung{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-12">
    <div class="max-w-md w-full space-y-8">
        <!-- Logo -->
        <div class="text-center">
            <div class="mx-auto w-20 h-20 bg-tv-dark rounded-2xl flex items-center justify-center mb-4">
                <svg class="w-12 h-12 text-tv-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                </svg>
            </div>
            <h1 class="text-3xl font-bold">TV Fernbedienung</h1>
            <p class="mt-2 text-gray-400">Bitte melden Sie sich an</p>
        </div>

        <!-- Login Form -->
        <form method="POST" action="{{ url_for('auth.login') }}" class="mt-8 space-y-6">
            {{ form.hidden_tag() if form else '' }}

            <div class="space-y-4">
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-300 mb-2">
                        Passwort
                    </label>
                    <input type="password"
                           name="password"
                           id="password"
                           required
                           autofocus
                           autocomplete="current-password"
                           class="w-full px-4 py-3 bg-tv-dark border border-gray-700 rounded-xl
                                  text-white placeholder-gray-500
                                  focus:outline-none focus:ring-2 focus:ring-tv-accent focus:border-transparent
                                  transition-all duration-200"
                           placeholder="Passwort eingeben">
                </div>

                <div class="flex items-center">
                    <input type="checkbox"
                           name="remember"
                           id="remember"
                           class="w-4 h-4 rounded bg-tv-dark border-gray-700 text-tv-accent
                                  focus:ring-tv-accent focus:ring-offset-0">
                    <label for="remember" class="ml-2 text-sm text-gray-400">
                        Angemeldet bleiben
                    </label>
                </div>
            </div>

            {% if error %}
            <div class="bg-red-900/50 border border-red-700 rounded-xl p-4 text-red-200">
                <div class="flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    {{ error }}
                </div>
            </div>
            {% endif %}

            <button type="submit"
                    class="w-full flex justify-center py-3 px-4 rounded-xl
                           bg-tv-accent hover:bg-indigo-500 active:bg-indigo-400
                           text-white font-medium
                           focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-tv-accent focus:ring-offset-tv-darker
                           transition-all duration-200">
                Anmelden
            </button>
        </form>

        <!-- Footer -->
        <p class="text-center text-sm text-gray-500">
            Sichere Verbindung via HTTPS
        </p>
    </div>
</div>
{% endblock %}

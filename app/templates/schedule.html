{% extends "base.html" %}

{% block title %}Zeitpläne - TV Fernbedienung{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 py-6">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold">Zeitpläne</h1>
        <a href="{{ url_for('schedule.create') }}"
           class="bg-tv-accent hover:bg-indigo-500 text-white px-4 py-2 rounded-xl flex items-center gap-2 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            Neu
        </a>
    </div>

    <!-- Schedule List -->
    <div id="schedule-list"
         class="space-y-4"
         hx-get="{{ url_for('api.all_schedules') }}"
         hx-trigger="load, refresh from:body"
         hx-swap="innerHTML">
        <!-- Loading state -->
        <div class="bg-tv-dark rounded-xl p-8 text-center text-gray-400">
            <svg class="animate-spin h-8 w-8 mx-auto mb-4" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Lade Zeitpläne...
        </div>
    </div>
</div>
{% endblock %}

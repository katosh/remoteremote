{% extends "base.html" %}

{% block title %}Fernbedienung - Philips TV{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-6" x-data="{ expertMode: false }">
    <!-- Mode Toggle -->
    <div class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-2">
            <h1 class="text-xl font-bold">Fernbedienung</h1>
            <span class="text-xs bg-blue-900 text-blue-300 px-2 py-0.5 rounded">Philips</span>
        </div>
        <label class="flex items-center cursor-pointer">
            <span class="text-sm text-gray-400 mr-2">Experten</span>
            <div class="relative">
                <input type="checkbox" x-model="expertMode" class="sr-only">
                <div class="w-10 h-6 bg-gray-700 rounded-full shadow-inner"
                     :class="{ 'bg-tv-accent': expertMode }"></div>
                <div class="absolute w-4 h-4 bg-white rounded-full shadow left-1 top-1 transition-transform"
                     :class="{ 'translate-x-4': expertMode }"></div>
            </div>
        </label>
    </div>

    <!-- TV Status Mini with Channel Info -->
    <div id="tv-status-mini" class="bg-tv-dark rounded-xl p-4 mb-6">
        <div class="flex items-center justify-between"
             hx-get="{{ url_for('api.tv_status') }}?mini=1"
             hx-trigger="load, every 5s"
             hx-swap="innerHTML">
            <div class="flex items-center gap-3">
                <div class="w-3 h-3 rounded-full {{ 'bg-green-500' if reachable else 'bg-red-500' }}"></div>
                <span class="text-sm">{{ 'Verbunden' if reachable else 'Nicht verbunden' }}</span>
            </div>
        </div>
        <!-- Current Activity/Channel Info (Philips-specific) -->
        <div id="philips-status-info" class="mt-3 pt-3 border-t border-gray-700" x-data="philipsStatus()">
            <div class="flex items-center justify-between text-sm">
                <div class="flex items-center gap-3 flex-1">
                    <!-- Activity Badge -->
                    <span class="px-2 py-0.5 rounded text-xs"
                          :class="{
                              'bg-blue-600': activity === 'tv',
                              'bg-purple-600': activity === 'home',
                              'bg-green-600': activity === 'app',
                              'bg-orange-600': activity === 'source',
                              'bg-emerald-600': activity === 'on',
                              'bg-gray-600': activity === 'unknown' || !activity
                          }"
                          x-text="activityLabel">--</span>
                    <!-- Channel/App Name -->
                    <span class="font-medium truncate" x-text="displayText">--</span>
                </div>
                <button @click="refreshStatus()"
                        class="text-gray-400 hover:text-white p-1 flex-shrink-0"
                        :class="loading ? 'animate-spin' : ''">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Normal Mode Controls -->
    <div x-show="!expertMode" class="space-y-6">
        <!-- Power Row -->
        <div class="flex justify-center gap-4">
            <button hx-post="{{ url_for('remote.power') }}"
                    hx-vals='{"action": "on"}'
                    hx-swap="none"
                    hx-disabled-elt="this"
                    hx-on::after-request="setTimeout(() => location.reload(), 3000)"
                    class="btn-remote w-20 h-20 rounded-full flex flex-col items-center justify-center bg-green-700 hover:bg-green-600">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M5.636 5.636a9 9 0 1 0 12.728 0M12 3v9"/>
                </svg>
                <span class="text-xs mt-1">Ein</span>
            </button>

            <button hx-post="{{ url_for('remote.power') }}"
                    hx-vals='{"action": "off"}'
                    hx-swap="none"
                    hx-disabled-elt="this"
                    hx-on::after-request="setTimeout(() => location.reload(), 2000)"
                    {% if not tv_has_token %}disabled{% endif %}
                    class="btn-remote btn-power w-20 h-20 rounded-full flex flex-col items-center justify-center {% if not tv_has_token %}opacity-50 cursor-not-allowed{% endif %}">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M5.636 5.636a9 9 0 1 0 12.728 0M12 3v9"/>
                </svg>
                <span class="text-xs mt-1">Aus</span>
            </button>
        </div>

        <!-- Volume & Navigation -->
        <div class="flex justify-between items-center">
            <!-- Volume Controls -->
            <div class="flex flex-col items-center gap-2" x-data="volumeControl()">
                <button @click="setVolume(Math.min(100, parseInt(volume) + 5))"
                        class="btn-remote w-12 h-10 text-lg font-bold">+</button>
                <div class="h-20 flex items-center py-1">
                    <input type="range" min="0" max="100" x-model="volume"
                           @change="setVolume(volume)"
                           class="volume-slider-vertical accent-tv-accent"
                           orient="vertical">
                </div>
                <span class="text-xs font-bold" x-text="volume + '%'">--%</span>
                <button @click="setVolume(Math.max(0, volume - 5))"
                        class="btn-remote w-12 h-10 text-lg font-bold">−</button>
                <button @click="toggleMute()"
                        class="btn-remote w-12 h-8 text-xs mt-1"
                        :class="muted ? 'bg-red-600' : ''">
                    <svg class="w-4 h-4 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path x-show="!muted" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707A1 1 0 0112 5v14a1 1 0 01-1.707.707L5.586 15z"/>
                        <path x-show="muted" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707A1 1 0 0112 5v14a1 1 0 01-1.707.707L5.586 15zM17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>
                    </svg>
                </button>
            </div>

            <!-- D-Pad Navigation -->
            <div class="relative w-48 h-48">
                <!-- Up -->
                <button hx-post="{{ url_for('remote.send_key', key='UP') }}"
                        hx-swap="none"
                        hx-disabled-elt="this"
                        class="btn-remote absolute top-0 left-1/2 -translate-x-1/2 w-16 h-16 rounded-t-full">
                    <svg class="w-6 h-6 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/>
                    </svg>
                </button>
                <!-- Down -->
                <button hx-post="{{ url_for('remote.send_key', key='DOWN') }}"
                        hx-swap="none"
                        hx-disabled-elt="this"
                        class="btn-remote absolute bottom-0 left-1/2 -translate-x-1/2 w-16 h-16 rounded-b-full">
                    <svg class="w-6 h-6 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                    </svg>
                </button>
                <!-- Left -->
                <button hx-post="{{ url_for('remote.send_key', key='LEFT') }}"
                        hx-swap="none"
                        hx-disabled-elt="this"
                        class="btn-remote absolute left-0 top-1/2 -translate-y-1/2 w-16 h-16 rounded-l-full">
                    <svg class="w-6 h-6 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                    </svg>
                </button>
                <!-- Right -->
                <button hx-post="{{ url_for('remote.send_key', key='RIGHT') }}"
                        hx-swap="none"
                        hx-disabled-elt="this"
                        class="btn-remote absolute right-0 top-1/2 -translate-y-1/2 w-16 h-16 rounded-r-full">
                    <svg class="w-6 h-6 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                </button>
                <!-- OK/Enter -->
                <button hx-post="{{ url_for('remote.send_key', key='ENTER') }}"
                        hx-swap="none"
                        hx-disabled-elt="this"
                        class="btn-remote absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-16 h-16 rounded-full bg-tv-accent hover:bg-indigo-500">
                    OK
                </button>
            </div>

            <!-- Channel Controls -->
            <div class="flex flex-col items-center gap-2">
                <button hx-post="{{ url_for('remote.send_key', key='CHUP') }}"
                        hx-swap="none"
                        hx-disabled-elt="this"
                        class="btn-remote btn-nav">
                    <svg class="w-6 h-6 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/>
                    </svg>
                </button>
                <span class="text-xs text-gray-500">CH</span>
                <button hx-post="{{ url_for('remote.send_key', key='CHDOWN') }}"
                        hx-swap="none"
                        hx-disabled-elt="this"
                        class="btn-remote btn-nav">
                    <svg class="w-6 h-6 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Control Row -->
        <div class="grid grid-cols-4 gap-3">
            <button hx-post="{{ url_for('remote.send_key', key='BACK') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-action">
                Zurück
            </button>
            <button hx-post="{{ url_for('remote.send_key', key='HOME') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-action">
                Home
            </button>
            <button hx-post="{{ url_for('remote.philips_tv_mode') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-action bg-blue-700 hover:bg-blue-600">
                TV
            </button>
            <button hx-post="{{ url_for('remote.send_key', key='SOURCE') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-action">
                Quelle
            </button>
        </div>

        <!-- Philips-Specific: Ambilight (direct API toggle, no menu) -->
        <div class="grid grid-cols-2 gap-3">
            <button hx-post="{{ url_for('remote.philips_ambilight') }}"
                    hx-vals='{"action": "toggle"}'
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-action bg-purple-700 hover:bg-purple-600 flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
                </svg>
                Ambilight
            </button>
            <button hx-post="{{ url_for('remote.send_key', key='OPTIONS') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-action">
                Optionen
            </button>
        </div>
    </div>

    <!-- Expert Mode Controls -->
    <div x-show="expertMode" x-cloak class="space-y-6">
        <!-- Number Pad -->
        <div class="grid grid-cols-3 gap-3">
            {% for num in range(1, 10) %}
            <button hx-post="{{ url_for('remote.send_key', key=num|string) }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-nav text-xl">
                {{ num }}
            </button>
            {% endfor %}
            <button hx-post="{{ url_for('remote.send_key', key='PRECH') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-nav text-sm">
                Vorher
            </button>
            <button hx-post="{{ url_for('remote.send_key', key='0') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-nav text-xl">
                0
            </button>
            <button hx-post="{{ url_for('remote.send_key', key='FIND') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-nav text-sm">
                Suchen
            </button>
        </div>

        <!-- Direct Volume Control -->
        <div class="bg-gray-800 rounded-xl p-4" x-data="volumeControl()">
            <div class="flex items-center justify-between mb-3">
                <label class="text-sm text-gray-400">Lautstärke</label>
                <div class="flex items-center gap-2">
                    <span class="text-lg font-bold" x-text="volume + '%'">--</span>
                    <button @click="refreshVolume()" class="text-gray-400 hover:text-white p-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="flex gap-3 items-center">
                <button @click="setVolume(Math.max(0, volume - 5))" class="btn-remote w-10 h-10 text-xl font-bold">−</button>
                <input type="range" min="0" max="100" x-model="volume" @change="setVolume(volume)"
                       class="flex-1 h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-tv-accent">
                <button @click="setVolume(Math.min(100, parseInt(volume) + 5))" class="btn-remote w-10 h-10 text-xl font-bold">+</button>
            </div>
            <div class="flex gap-2 mt-3">
                <button @click="setVolume(10)" class="btn-remote flex-1 py-2 text-sm">10%</button>
                <button @click="setVolume(25)" class="btn-remote flex-1 py-2 text-sm">25%</button>
                <button @click="setVolume(50)" class="btn-remote flex-1 py-2 text-sm">50%</button>
                <button @click="toggleMute()" class="btn-remote flex-1 py-2 text-sm" :class="muted ? 'bg-red-600' : ''">
                    <span x-text="muted ? 'Ton an' : 'Stumm'">Stumm</span>
                </button>
            </div>
        </div>

        <!-- Color Buttons -->
        <div class="grid grid-cols-4 gap-3">
            <button hx-post="{{ url_for('remote.send_key', key='RED') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-nav bg-red-600 hover:bg-red-500">
            </button>
            <button hx-post="{{ url_for('remote.send_key', key='GREEN') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-nav bg-green-600 hover:bg-green-500">
            </button>
            <button hx-post="{{ url_for('remote.send_key', key='YELLOW') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-nav bg-yellow-500 hover:bg-yellow-400">
            </button>
            <button hx-post="{{ url_for('remote.send_key', key='BLUE') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-nav bg-blue-600 hover:bg-blue-500">
            </button>
        </div>

        <!-- Playback Controls -->
        <div class="grid grid-cols-5 gap-3">
            <button hx-post="{{ url_for('remote.send_key', key='REWIND') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-action">
                <svg class="w-5 h-5 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0019 16V8a1 1 0 00-1.6-.8l-5.333 4zM4.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0011 16V8a1 1 0 00-1.6-.8l-5.334 4z"/>
                </svg>
            </button>
            <button hx-post="{{ url_for('remote.send_key', key='PLAY') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-action">
                <svg class="w-5 h-5 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
                </svg>
            </button>
            <button hx-post="{{ url_for('remote.send_key', key='PAUSE') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-action">
                <svg class="w-5 h-5 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6"/>
                </svg>
            </button>
            <button hx-post="{{ url_for('remote.send_key', key='STOP') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-action">
                <svg class="w-5 h-5 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 6h12v12H6z"/>
                </svg>
            </button>
            <button hx-post="{{ url_for('remote.send_key', key='FASTFORWARD') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-action">
                <svg class="w-5 h-5 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.933 12.8a1 1 0 000-1.6L6.6 7.2A1 1 0 005 8v8a1 1 0 001.6.8l5.333-4zM19.933 12.8a1 1 0 000-1.6l-5.333-4A1 1 0 0013 8v8a1 1 0 001.6.8l5.333-4z"/>
                </svg>
            </button>
        </div>

        <!-- Special Keys -->
        <div class="grid grid-cols-3 gap-3">
            <button hx-post="{{ url_for('remote.send_key', key='INFO') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-action">
                Info
            </button>
            <button hx-post="{{ url_for('remote.send_key', key='OPTIONS') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-action">
                Optionen
            </button>
            <button hx-post="{{ url_for('remote.send_key', key='ADJUST') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-action">
                Anpassen
            </button>
            <button hx-post="{{ url_for('remote.send_key', key='SUBTITLE') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-action">
                Untertitel
            </button>
            <button hx-post="{{ url_for('remote.send_key', key='TELETEXT') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-action">
                Teletext
            </button>
            <button hx-post="{{ url_for('remote.send_key', key='RECORD') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-action bg-red-700 hover:bg-red-600">
                Aufnahme
            </button>
        </div>

        <!-- Ambilight Controls (API-based, no menu) -->
        <div class="bg-gray-800 rounded-xl p-4">
            <h3 class="text-sm text-gray-400 mb-3">Ambilight</h3>
            <div class="grid grid-cols-3 gap-3">
                <button hx-post="{{ url_for('remote.philips_ambilight') }}"
                        hx-vals='{"action": "on"}'
                        hx-swap="none"
                        hx-disabled-elt="this"
                        class="btn-remote btn-action bg-green-700 hover:bg-green-600 flex items-center justify-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
                    </svg>
                    An
                </button>
                <button hx-post="{{ url_for('remote.philips_ambilight') }}"
                        hx-vals='{"action": "off"}'
                        hx-swap="none"
                        hx-disabled-elt="this"
                        class="btn-remote btn-action bg-red-700 hover:bg-red-600 flex items-center justify-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/>
                    </svg>
                    Aus
                </button>
                <button hx-post="{{ url_for('remote.send_key', key='AMBILIGHT') }}"
                        hx-swap="none"
                        hx-disabled-elt="this"
                        class="btn-remote btn-action bg-purple-700 hover:bg-purple-600">
                    Menü
                </button>
            </div>
        </div>
    </div>
</div>

<style>
    [x-cloak] { display: none !important; }

    .btn-remote {
        transition: opacity 0.1s ease, filter 0.1s ease;
    }

    .btn-remote:active,
    .btn-remote.btn-pressed {
        opacity: 0.5;
    }

    .btn-remote.btn-success {
        opacity: 1;
        filter: brightness(1.3);
    }

    .volume-slider-vertical {
        writing-mode: vertical-lr;
        direction: rtl;
        -webkit-appearance: slider-vertical;
        appearance: slider-vertical;
        width: 24px;
        height: 100%;
        background: transparent;
        cursor: pointer;
    }

    .volume-slider-vertical::-webkit-slider-runnable-track {
        width: 8px;
        background: #374151;
        border-radius: 4px;
    }

    .volume-slider-vertical::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        background: #4f46e5;
        border-radius: 50%;
        cursor: pointer;
        margin-left: -6px;
    }

    .volume-slider-vertical::-moz-range-track {
        width: 8px;
        background: #374151;
        border-radius: 4px;
    }

    .volume-slider-vertical::-moz-range-thumb {
        width: 20px;
        height: 20px;
        background: #4f46e5;
        border-radius: 50%;
        border: none;
        cursor: pointer;
    }
</style>

<script>
    // Button press feedback
    document.addEventListener('htmx:beforeRequest', function(evt) {
        const btn = evt.target;
        if (btn.classList.contains('btn-remote')) {
            btn.classList.add('btn-pressed');
        }
    });

    document.addEventListener('htmx:afterRequest', function(evt) {
        const btn = evt.target;
        if (btn.classList.contains('btn-remote')) {
            btn.classList.remove('btn-pressed');
            btn.classList.add('btn-success');
            setTimeout(() => btn.classList.remove('btn-success'), 300);
        }
    });

    function getCsrfToken() {
        return document.querySelector('meta[name="csrf-token"]').content;
    }

    // Philips TV status (activity, channel info)
    function philipsStatus() {
        return {
            power: null,
            activity: null,
            activityName: null,
            channelName: null,
            source: null,
            loading: false,

            get activityLabel() {
                if (this.power === 'standby') return 'Standby';
                if (this.power === null) return 'Offline';
                if (!this.activity) return 'Laden...';
                switch(this.activity) {
                    case 'tv': return 'Live TV';
                    case 'home': return 'Home';
                    case 'app': return 'App';
                    case 'source': return 'Quelle';
                    case 'on': return 'An';
                    case 'unknown': return '?';
                    default: return this.activity || '?';
                }
            },

            get displayText() {
                if (this.power === 'standby') return 'TV ist im Standby';
                if (this.power === null) return 'Nicht erreichbar';
                if (this.activity === 'tv' && this.channelName) {
                    return this.channelName;
                }
                if (this.activityName) {
                    return this.activityName;
                }
                return '';
            },

            init() {
                this.refreshStatus();
                // Auto-refresh every 10 seconds
                setInterval(() => this.refreshStatus(), 10000);
            },

            async refreshStatus() {
                if (this.loading) return;
                this.loading = true;
                try {
                    const response = await fetch('{{ url_for("remote.philips_status") }}', {
                        headers: { 'X-CSRFToken': getCsrfToken() }
                    });
                    const data = await response.json();
                    if (data.success) {
                        this.power = data.power;
                        this.activity = data.activity;
                        this.activityName = data.activity_name;
                        this.channelName = data.channel_name;
                        this.source = data.source;
                    }
                } catch (e) {
                    console.log('Could not get Philips status:', e);
                }
                this.loading = false;
            }
        };
    }

    function volumeControl() {
        return {
            volume: 20,
            muted: false,
            loading: false,

            init() {
                this.refreshVolume();
            },

            async refreshVolume() {
                try {
                    const formData = new FormData();
                    formData.append('action', 'get');
                    const response = await fetch('{{ url_for("remote.volume") }}', {
                        method: 'POST',
                        headers: { 'X-CSRFToken': getCsrfToken() },
                        body: formData
                    });
                    const data = await response.json();
                    if (data.success) {
                        this.volume = data.volume;
                        this.muted = data.muted || false;
                    }
                } catch (e) {
                    console.log('Could not get volume:', e);
                }
            },

            async setVolume(value) {
                this.volume = parseInt(value);
                const formData = new FormData();
                formData.append('action', 'set');
                formData.append('value', this.volume);
                try {
                    await fetch('{{ url_for("remote.volume") }}', {
                        method: 'POST',
                        headers: { 'X-CSRFToken': getCsrfToken() },
                        body: formData
                    });
                } catch (e) {
                    console.log('Could not set volume:', e);
                }
            },

            async toggleMute() {
                const formData = new FormData();
                formData.append('action', 'mute');
                try {
                    await fetch('{{ url_for("remote.volume") }}', {
                        method: 'POST',
                        headers: { 'X-CSRFToken': getCsrfToken() },
                        body: formData
                    });
                    this.muted = !this.muted;
                } catch (e) {
                    console.log('Could not toggle mute:', e);
                }
            }
        };
    }
</script>
{% endblock %}

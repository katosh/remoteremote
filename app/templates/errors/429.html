{% extends "base.html" %}

{% block title %}{{ _('Too Many Requests') }} - remoteRemote{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="text-center">
        <div class="text-8xl font-bold text-gray-700 mb-4">429</div>
        <h1 class="text-2xl font-semibold mb-2">{{ _('Too Many Requests') }}</h1>
        <p class="text-gray-400 mb-8">{{ _('Please wait a moment before trying again.') }}</p>
        <a href="{{ url_for('main.dashboard') if current_user.is_authenticated else url_for('auth.login') }}"
           class="inline-block px-6 py-3 bg-tv-accent hover:bg-indigo-500 rounded-xl transition-colors">
            {{ _('Back to Home') }}
        </a>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}{{ _('Not Found') }} - remoteRemote{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="text-center">
        <div class="text-8xl font-bold text-gray-700 mb-4">404</div>
        <h1 class="text-2xl font-semibold mb-2">Seite nicht gefunden</h1>
        <p class="text-gray-400 mb-8">Die angeforderte Seite existiert nicht.</p>
        <a href="{{ url_for('main.dashboard') if current_user.is_authenticated else url_for('auth.login') }}"
           class="inline-block px-6 py-3 bg-tv-accent hover:bg-indigo-500 rounded-xl transition-colors">
            Zur Startseite
        </a>
    </div>
</div>
{% endblock %}

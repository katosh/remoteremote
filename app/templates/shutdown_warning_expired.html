<!DOCTYPE html>
<html lang="{{ g.locale }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('Warning Expired') }} - remoteRemote</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-8">
    <div class="max-w-lg w-full text-center space-y-6">
        <svg class="w-24 h-24 mx-auto text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>

        <h1 class="text-3xl font-bold text-gray-400">{{ _('Warning Expired') }}</h1>
        <p class="text-xl text-gray-500">
            {{ _('This shutdown warning has expired or is no longer valid.') }}
        </p>

        <button onclick="window.location.href='/'"
                autofocus
                class="mt-8 px-8 py-4 bg-gray-700 hover:bg-gray-600 rounded-xl text-lg font-medium transition-colors">
            {{ _('Go to Dashboard') }}
        </button>
    </div>
</body>
</html>

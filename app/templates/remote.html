{% extends "base.html" %}

{% block title %}{{ _('Remote') }} - remoteRemote{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-6" x-data="{ expertMode: false }">
    <!-- Mode Toggle -->
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-xl font-bold">{{ _('Remote') }}</h1>
        <label class="flex items-center cursor-pointer">
            <span class="text-sm text-gray-400 mr-2">{{ _('Expert') }}</span>
            <div class="relative">
                <input type="checkbox" x-model="expertMode" class="sr-only">
                <div class="w-10 h-6 bg-gray-700 rounded-full shadow-inner"
                     :class="{ 'bg-tv-accent': expertMode }"></div>
                <div class="absolute w-4 h-4 bg-white rounded-full shadow left-1 top-1 transition-transform"
                     :class="{ 'translate-x-4': expertMode }"></div>
            </div>
        </label>
    </div>

    <!-- TV Status Card - Alpine.js powered, polls every 5s -->
    <div id="tv-status-card" class="bg-tv-dark rounded-xl p-4 mb-6">
        {% with should_poll=true %}
        {% include 'partials/tv_status.html' %}
        {% endwith %}
    </div>

    <!-- Normal Mode Controls -->
    <div x-show="!expertMode" class="space-y-6">
        <!-- Volume & Navigation -->
        <div class="flex justify-between items-center">
            <!-- Volume Slider (UPnP) -->
            <div class="flex flex-col items-center" x-data="volumeControl()">
                <button @click="setVolume(Math.min(100, parseInt(volume) + 5))"
                        class="btn-remote w-10 h-8 text-sm font-bold">+</button>
                <div class="h-24 flex items-center py-1">
                    <input type="range" min="0" max="100" x-model="volume"
                           @change="setVolume(volume)"
                           class="volume-slider-vertical accent-tv-accent"
                           orient="vertical">
                </div>
                <span class="text-xs font-bold my-1" x-text="volume + '%'">--%</span>
                <button @click="setVolume(Math.max(0, volume - 5))"
                        class="btn-remote w-10 h-8 text-sm font-bold">−</button>
                <button @click="toggleMute()"
                        class="btn-remote w-10 h-7 text-xs mt-1"
                        :class="muted ? 'bg-red-600' : ''">
                    <svg class="w-3 h-3 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path x-show="!muted" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707A1 1 0 0112 5v14a1 1 0 01-1.707.707L5.586 15z"/>
                        <path x-show="muted" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707A1 1 0 0112 5v14a1 1 0 01-1.707.707L5.586 15zM17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>
                    </svg>
                </button>
            </div>

            <!-- D-Pad Navigation -->
            <div class="relative w-48 h-48">
                <!-- Up -->
                <button hx-post="{{ url_for('remote.send_key', key='KEY_UP') }}"
                        hx-swap="none"
                        hx-disabled-elt="this"
                        class="btn-remote absolute top-0 left-1/2 -translate-x-1/2 w-16 h-16 rounded-t-full">
                    <svg class="w-6 h-6 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/>
                    </svg>
                </button>
                <!-- Down -->
                <button hx-post="{{ url_for('remote.send_key', key='KEY_DOWN') }}"
                        hx-swap="none"
                        hx-disabled-elt="this"
                        class="btn-remote absolute bottom-0 left-1/2 -translate-x-1/2 w-16 h-16 rounded-b-full">
                    <svg class="w-6 h-6 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                    </svg>
                </button>
                <!-- Left -->
                <button hx-post="{{ url_for('remote.send_key', key='KEY_LEFT') }}"
                        hx-swap="none"
                        hx-disabled-elt="this"
                        class="btn-remote absolute left-0 top-1/2 -translate-y-1/2 w-16 h-16 rounded-l-full">
                    <svg class="w-6 h-6 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                    </svg>
                </button>
                <!-- Right -->
                <button hx-post="{{ url_for('remote.send_key', key='KEY_RIGHT') }}"
                        hx-swap="none"
                        hx-disabled-elt="this"
                        class="btn-remote absolute right-0 top-1/2 -translate-y-1/2 w-16 h-16 rounded-r-full">
                    <svg class="w-6 h-6 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                </button>
                <!-- OK/Enter -->
                <button hx-post="{{ url_for('remote.send_key', key='KEY_ENTER') }}"
                        hx-swap="none"
                        hx-disabled-elt="this"
                        class="btn-remote absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-16 h-16 rounded-full bg-tv-accent hover:bg-indigo-500">
                    OK
                </button>
            </div>

            <!-- Channel Controls -->
            <div class="flex flex-col items-center gap-2">
                <button hx-post="{{ url_for('remote.send_key', key='KEY_CHUP') }}"
                        hx-swap="none"
                        hx-disabled-elt="this"
                        class="btn-remote btn-nav">
                    <svg class="w-6 h-6 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/>
                    </svg>
                </button>
                <span class="text-xs text-gray-500">CH</span>
                <button hx-post="{{ url_for('remote.send_key', key='KEY_CHDOWN') }}"
                        hx-swap="none"
                        hx-disabled-elt="this"
                        class="btn-remote btn-nav">
                    <svg class="w-6 h-6 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Control Row -->
        <div class="grid grid-cols-4 gap-3">
            <button hx-post="{{ url_for('remote.send_key', key='KEY_RETURN') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-action">
                {{ _('Back') }}
            </button>
            <button hx-post="{{ url_for('remote.send_key', key='KEY_HOME') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-action">
                {{ _('Home') }}
            </button>
            <button hx-post="{{ url_for('remote.send_key', key='KEY_MUTE') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-action">
                {{ _('Mute') }}
            </button>
            <button hx-post="{{ url_for('remote.send_key', key='KEY_SOURCE') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-action">
                {{ _('Source') }}
            </button>
        </div>

        <!-- Color Buttons -->
        <div class="grid grid-cols-4 gap-3">
            <button hx-post="{{ url_for('remote.send_key', key='KEY_RED') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote h-10 rounded-lg bg-red-600 hover:bg-red-500">&nbsp;</button>
            <button hx-post="{{ url_for('remote.send_key', key='KEY_GREEN') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote h-10 rounded-lg bg-green-600 hover:bg-green-500">&nbsp;</button>
            <button hx-post="{{ url_for('remote.send_key', key='KEY_YELLOW') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote h-10 rounded-lg bg-yellow-500 hover:bg-yellow-400">&nbsp;</button>
            <button hx-post="{{ url_for('remote.send_key', key='KEY_BLUE') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote h-10 rounded-lg bg-blue-600 hover:bg-blue-500">&nbsp;</button>
        </div>

        <!-- Media Controls -->
        <div class="grid grid-cols-4 gap-3">
            <button hx-post="{{ url_for('remote.send_key', key='KEY_REWIND') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote h-12 rounded-lg flex items-center justify-center">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/>
                </svg>
            </button>
            <button hx-post="{{ url_for('remote.send_key', key='KEY_PLAY') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote h-12 rounded-lg flex items-center justify-center">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z"/>
                </svg>
            </button>
            <button hx-post="{{ url_for('remote.send_key', key='KEY_PAUSE') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote h-12 rounded-lg flex items-center justify-center">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
            </button>
            <button hx-post="{{ url_for('remote.send_key', key='KEY_FF') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote h-12 rounded-lg flex items-center justify-center">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/>
                </svg>
            </button>
        </div>

    </div>

    <!-- Expert Mode Controls -->
    <div x-show="expertMode" x-cloak class="space-y-6">
        <!-- Power Buttons (manual fallback) -->
        <div class="grid grid-cols-2 gap-3">
            <button hx-post="{{ url_for('remote.power') }}"
                    hx-vals='{"action": "on"}'
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote py-3 flex items-center justify-center gap-2 bg-green-700 hover:bg-green-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M5.636 5.636a9 9 0 1 0 12.728 0M12 3v9"/>
                </svg>
                <span class="text-sm">{{ _('Turn On') }}</span>
            </button>
            <button hx-post="{{ url_for('remote.power') }}"
                    hx-vals='{"action": "off"}'
                    hx-swap="none"
                    hx-disabled-elt="this"
                    {% if not tv_has_token %}disabled{% endif %}
                    class="btn-remote btn-power py-3 flex items-center justify-center gap-2 {% if not tv_has_token %}opacity-50 cursor-not-allowed{% endif %}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M5.636 5.636a9 9 0 1 0 12.728 0M12 3v9"/>
                </svg>
                <span class="text-sm">{{ _('Turn Off') }}</span>
            </button>
        </div>

        <!-- Number Pad -->
        <div class="grid grid-cols-3 gap-3">
            {% for num in range(1, 10) %}
            <button hx-post="{{ url_for('remote.send_key', key='KEY_' ~ num) }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-nav text-xl">
                {{ num }}
            </button>
            {% endfor %}
            <button hx-post="{{ url_for('remote.send_key', key='KEY_PRECH') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-nav text-sm">
                {{ _('Previous') }}
            </button>
            <button hx-post="{{ url_for('remote.send_key', key='KEY_0') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-nav text-xl">
                0
            </button>
            <button hx-post="{{ url_for('remote.send_key', key='KEY_CHLIST') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-nav text-sm">
                {{ _('List') }}
            </button>
        </div>

        <!-- Direct Channel Input -->
        <div class="bg-gray-800 rounded-xl p-4">
            <label class="block text-sm text-gray-400 mb-2">{{ _('Go to channel:') }}</label>
            <form class="flex gap-2" hx-post="{{ url_for('remote.channel') }}" hx-swap="none"
                  @submit.prevent="$el.requestSubmit()">
                <input type="hidden" name="action" value="set">
                <input type="number"
                       name="channel"
                       min="1"
                       max="9999"
                       placeholder="{{ _('Channel number') }}"
                       required
                       class="flex-1 px-4 py-2 bg-gray-700 rounded-lg text-white placeholder-gray-500
                              focus:outline-none focus:ring-2 focus:ring-tv-accent">
                <button type="submit" class="btn-remote px-6">Go</button>
            </form>
        </div>

        <!-- Direct Volume Control (UPnP) -->
        <div class="bg-gray-800 rounded-xl p-4" x-data="volumeControl()">
            <div class="flex items-center justify-between mb-3">
                <label class="text-sm text-gray-400">{{ _('Volume (UPnP)') }}</label>
                <div class="flex items-center gap-2">
                    <span class="text-lg font-bold" x-text="volume + '%'">--</span>
                    <button @click="refreshVolume()" class="text-gray-400 hover:text-white p-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="flex gap-3 items-center">
                <button @click="setVolume(Math.max(0, volume - 5))" class="btn-remote w-10 h-10 text-xl font-bold">−</button>
                <input type="range" min="0" max="100" x-model="volume" @change="setVolume(volume)"
                       class="flex-1 h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-tv-accent">
                <button @click="setVolume(Math.min(100, parseInt(volume) + 5))" class="btn-remote w-10 h-10 text-xl font-bold">+</button>
            </div>
            <div class="flex gap-2 mt-3">
                <button @click="setVolume(10)" class="btn-remote flex-1 py-2 text-sm">10%</button>
                <button @click="setVolume(25)" class="btn-remote flex-1 py-2 text-sm">25%</button>
                <button @click="setVolume(50)" class="btn-remote flex-1 py-2 text-sm">50%</button>
                <button @click="toggleMute()" class="btn-remote flex-1 py-2 text-sm" :class="muted ? 'bg-red-600' : ''">
                    <span x-text="muted ? 'Ton an' : 'Stumm'">Stumm</span>
                </button>
            </div>
        </div>

        <!-- Text Input -->
        <div class="bg-gray-800 rounded-xl p-4">
            <label class="block text-sm text-gray-400 mb-2">{{ _('Enter text (for search fields):') }}</label>
            <form class="flex gap-2" hx-post="{{ url_for('remote.send_text') }}" hx-swap="none"
                  @submit.prevent="$el.requestSubmit(); $el.reset();">
                <input type="text"
                       name="text"
                       placeholder="{{ _('Enter text...') }}"
                       required
                       class="flex-1 px-4 py-2 bg-gray-700 rounded-lg text-white placeholder-gray-500
                              focus:outline-none focus:ring-2 focus:ring-tv-accent">
                <button type="submit" class="btn-remote px-6">{{ _('Send') }}</button>
            </form>
        </div>

        <!-- Color Buttons -->
        <div class="grid grid-cols-4 gap-3">
            <button hx-post="{{ url_for('remote.send_key', key='KEY_RED') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote h-10 rounded-lg bg-red-600 hover:bg-red-500">&nbsp;</button>
            <button hx-post="{{ url_for('remote.send_key', key='KEY_GREEN') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote h-10 rounded-lg bg-green-600 hover:bg-green-500">&nbsp;</button>
            <button hx-post="{{ url_for('remote.send_key', key='KEY_YELLOW') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote h-10 rounded-lg bg-yellow-500 hover:bg-yellow-400">&nbsp;</button>
            <button hx-post="{{ url_for('remote.send_key', key='KEY_BLUE') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote h-10 rounded-lg bg-blue-600 hover:bg-blue-500">&nbsp;</button>
        </div>

        <!-- Playback Controls -->
        <div class="grid grid-cols-5 gap-3">
            <button hx-post="{{ url_for('remote.send_key', key='KEY_REWIND') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-action">
                <svg class="w-5 h-5 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0019 16V8a1 1 0 00-1.6-.8l-5.333 4zM4.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0011 16V8a1 1 0 00-1.6-.8l-5.334 4z"/>
                </svg>
            </button>
            <button hx-post="{{ url_for('remote.send_key', key='KEY_PLAY') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-action">
                <svg class="w-5 h-5 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
                </svg>
            </button>
            <button hx-post="{{ url_for('remote.send_key', key='KEY_PAUSE') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-action">
                <svg class="w-5 h-5 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6"/>
                </svg>
            </button>
            <button hx-post="{{ url_for('remote.send_key', key='KEY_STOP') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-action">
                <svg class="w-5 h-5 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 6h12v12H6z"/>
                </svg>
            </button>
            <button hx-post="{{ url_for('remote.send_key', key='KEY_FF') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-action">
                <svg class="w-5 h-5 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.933 12.8a1 1 0 000-1.6L6.6 7.2A1 1 0 005 8v8a1 1 0 001.6.8l5.333-4zM19.933 12.8a1 1 0 000-1.6l-5.333-4A1 1 0 0013 8v8a1 1 0 001.6.8l5.333-4z"/>
                </svg>
            </button>
        </div>

        <!-- Special Keys -->
        <div class="grid grid-cols-3 gap-3">
            <button hx-post="{{ url_for('remote.send_key', key='KEY_INFO') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-action">
                {{ _('Info') }}
            </button>
            <button hx-post="{{ url_for('remote.send_key', key='KEY_MENU') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-action">
                {{ _('Menu') }}
            </button>
            <button hx-post="{{ url_for('remote.send_key', key='KEY_TOOLS') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-action">
                {{ _('Tools') }}
            </button>
            <button hx-post="{{ url_for('remote.send_key', key='KEY_EXIT') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-action">
                {{ _('Exit') }}
            </button>
            <button hx-post="{{ url_for('remote.send_key', key='KEY_CAPTION') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-action">
                {{ _('Subtitles') }}
            </button>
            <button hx-post="{{ url_for('remote.send_key', key='KEY_AD') }}"
                    hx-swap="none"
                    hx-disabled-elt="this"
                    class="btn-remote btn-action">
                {{ _('Audio') }}
            </button>
        </div>

    </div>
</div>

<style>
    [x-cloak] { display: none !important; }

    /* Button press feedback */
    .btn-remote {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        transition: box-shadow 0.1s ease-out;
    }

    .btn-remote:active,
    .btn-remote.btn-pressed {
        box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    /* Single smooth pulse animation on success - shadow only, no brightness flicker */
    @keyframes btn-pulse {
        0% { box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.4); }
        50% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.8), 0 0 40px rgba(99, 102, 241, 0.4); }
        100% { box-shadow: none; }
    }

    .btn-remote.btn-pulse {
        animation: btn-pulse 0.35s ease-out forwards;
    }

    /* Vertical volume slider */
    .volume-slider-vertical {
        writing-mode: vertical-lr;
        direction: rtl;
        -webkit-appearance: slider-vertical;
        appearance: slider-vertical;
        width: 24px;
        height: 100%;
        background: transparent;
        cursor: pointer;
    }

    .volume-slider-vertical::-webkit-slider-runnable-track {
        width: 8px;
        background: #374151;
        border-radius: 4px;
    }

    .volume-slider-vertical::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        background: #4f46e5;
        border-radius: 50%;
        cursor: pointer;
        margin-left: -6px;
    }

    .volume-slider-vertical::-moz-range-track {
        width: 8px;
        background: #374151;
        border-radius: 4px;
    }

    .volume-slider-vertical::-moz-range-thumb {
        width: 20px;
        height: 20px;
        background: #4f46e5;
        border-radius: 50%;
        border: none;
        cursor: pointer;
    }
</style>

<script>
    // Button press feedback with single pulse animation
    document.addEventListener('htmx:beforeRequest', function(evt) {
        const btn = evt.target;
        if (btn.classList.contains('btn-remote')) {
            btn.classList.add('btn-pressed');
            btn.classList.remove('btn-pulse');
        }
    });

    document.addEventListener('htmx:afterRequest', function(evt) {
        const btn = evt.target;
        if (btn.classList.contains('btn-remote')) {
            btn.classList.remove('btn-pressed');
            // Trigger single pulse animation
            void btn.offsetWidth; // Force reflow to restart animation
            btn.classList.add('btn-pulse');
            // Clean up after animation completes
            setTimeout(() => btn.classList.remove('btn-pulse'), 350);
        }
    });

    // Handle non-HTMX buttons (Alpine.js volume controls, etc.)
    document.addEventListener('click', function(evt) {
        const btn = evt.target.closest('.btn-remote');
        if (btn && !btn.hasAttribute('hx-post') && !btn.hasAttribute('hx-get')) {
            // Non-HTMX button - trigger pulse animation directly
            btn.classList.remove('btn-pulse');
            void btn.offsetWidth;
            btn.classList.add('btn-pulse');
            setTimeout(() => btn.classList.remove('btn-pulse'), 350);
        }
    });

    // Volume control via UPnP
    function volumeControl() {
        return {
            volume: 20,
            muted: false,
            loading: false,

            init() {
                this.refreshVolume();
            },

            async refreshVolume() {
                try {
                    const formData = new FormData();
                    formData.append('action', 'get');
                    const response = await fetch('{{ url_for("remote.volume") }}', {
                        method: 'POST',
                        headers: { 'X-CSRFToken': getCsrfToken() },
                        body: formData
                    });
                    const data = await response.json();
                    if (data.success) {
                        this.volume = data.volume;
                        this.muted = data.muted || false;
                    }
                } catch (e) {
                    console.log('Could not get volume:', e);
                }
            },

            async setVolume(value) {
                this.volume = parseInt(value);
                const formData = new FormData();
                formData.append('action', 'set');
                formData.append('value', this.volume);
                try {
                    await fetch('{{ url_for("remote.volume") }}', {
                        method: 'POST',
                        headers: { 'X-CSRFToken': getCsrfToken() },
                        body: formData
                    });
                } catch (e) {
                    console.log('Could not set volume:', e);
                }
            },

            async toggleMute() {
                const formData = new FormData();
                formData.append('action', 'mute');
                try {
                    await fetch('{{ url_for("remote.volume") }}', {
                        method: 'POST',
                        headers: { 'X-CSRFToken': getCsrfToken() },
                        body: formData
                    });
                    this.muted = !this.muted;
                } catch (e) {
                    console.log('Could not toggle mute:', e);
                }
            }
        };
    }
</script>
{% endblock %}

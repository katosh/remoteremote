{% extends "base.html" %}

{% block title %}Aktivitätsprotokoll - TV Fernbedienung{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 py-6" x-data="{
    category: '',
    level: '',
    search: ''
}">
    <!-- Header -->
    <div class="flex items-center gap-4 mb-6">
        <a href="{{ url_for('settings.settings_view') }}"
           class="p-2 rounded-lg hover:bg-gray-800 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
        </a>
        <h1 class="text-2xl font-bold">Aktivitätsprotokoll</h1>
    </div>

    <!-- Filters -->
    <div class="bg-tv-dark rounded-xl p-4 mb-6">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
                <label class="block text-sm text-gray-400 mb-2">Kategorie</label>
                <select x-model="category"
                        @change="htmx.trigger('#log-list', 'refresh')"
                        class="w-full px-4 py-2 bg-gray-800 border border-gray-700 rounded-xl text-white
                               focus:outline-none focus:ring-2 focus:ring-tv-accent">
                    <option value="">Alle</option>
                    <option value="auth">Authentifizierung</option>
                    <option value="action">Aktionen</option>
                    <option value="schedule">Zeitpläne</option>
                    <option value="config">Konfiguration</option>
                    <option value="system">System</option>
                </select>
            </div>

            <div>
                <label class="block text-sm text-gray-400 mb-2">Level</label>
                <select x-model="level"
                        @change="htmx.trigger('#log-list', 'refresh')"
                        class="w-full px-4 py-2 bg-gray-800 border border-gray-700 rounded-xl text-white
                               focus:outline-none focus:ring-2 focus:ring-tv-accent">
                    <option value="">Alle</option>
                    <option value="INFO">Info</option>
                    <option value="WARNING">Warnung</option>
                    <option value="ERROR">Fehler</option>
                </select>
            </div>

            <div>
                <label class="block text-sm text-gray-400 mb-2">Suche</label>
                <input type="text"
                       x-model="search"
                       @input.debounce.300ms="htmx.trigger('#log-list', 'refresh')"
                       placeholder="Nachricht suchen..."
                       class="w-full px-4 py-2 bg-gray-800 border border-gray-700 rounded-xl text-white
                              placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-tv-accent">
            </div>
        </div>
    </div>

    <!-- Log List -->
    <div id="log-list"
         hx-get="{{ url_for('api.recent_logs') }}"
         hx-trigger="load, refresh"
         hx-vals="js:{category: category, level: level, search: search}"
         hx-swap="innerHTML"
         class="space-y-2">
        <!-- Loading -->
        <div class="bg-tv-dark rounded-xl p-8 text-center text-gray-400">
            <svg class="animate-spin h-8 w-8 mx-auto mb-4" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Lade Protokoll...
        </div>
    </div>

    <!-- Load More -->
    <div class="mt-6 text-center">
        <button id="load-more"
                hx-get="{{ url_for('api.recent_logs') }}"
                hx-vals="js:{category: category, level: level, search: search, offset: document.querySelectorAll('#log-list > div').length}"
                hx-target="#log-list"
                hx-swap="beforeend"
                class="px-6 py-3 bg-gray-700 hover:bg-gray-600 rounded-xl transition-colors">
            Mehr laden
        </button>
    </div>

    <!-- Export -->
    <div class="mt-6 text-center">
        <a href="{{ url_for('settings.export_logs') }}"
           class="text-tv-accent hover:underline">
            Als CSV exportieren
        </a>
    </div>
</div>
{% endblock %}
